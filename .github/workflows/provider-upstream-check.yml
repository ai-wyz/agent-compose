name: Provider upstream check

# Answers "is a provider we pin newer upstream?" once a day and reports it where
# a team already looks: one tracking issue plus an optional DingTalk push. It
# never edits a pin on its own, because deciding whether a provider release is
# safe is the part that needs a person and the guest image's acceptance tests.
#
# GitHub's scheduler is best-effort: a cron entry can be delayed, and scheduled
# workflows are disabled after 60 days of repository inactivity. workflow_dispatch
# exists so the same report can be produced on demand.
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: Also open a draft pull request that bumps the outdated pins
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

# The scan is idempotent and edits one shared issue, so overlapping runs would
# only race on that issue's body. Never cancel a run mid-flight for the same
# reason.
concurrency:
  group: provider-upstream-check
  cancel-in-progress: false

env:
  ISSUE_LABEL: provider-upgrade
  ISSUE_TITLE: 'chore(deps): upstream provider releases pending'

jobs:
  check-upstreams:
    name: Scan pinned providers against npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan upstream releases
        id: scan
        env:
          PROVIDER_UPSTREAM_OUTPUT_DIR: ${{ runner.temp }}
          PROVIDER_UPGRADE_MENTIONS: ${{ vars.PROVIDER_UPGRADE_MENTIONS }}
          NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY }}
        run: ./scripts/check-provider-upstreams.sh

      - name: Summarize the scan
        run: cat "${{ runner.temp }}/provider-upstream-report.md" >>"$GITHUB_STEP_SUMMARY"

      - name: Update the tracking issue
        if: steps.scan.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/provider-upstream-report.md
        run: |
          set -euo pipefail
          gh label create "$ISSUE_LABEL" \
            --color 1d76db \
            --description 'A pinned guest provider has a newer upstream release' \
            --force
          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue edit "$number" --body-file "$REPORT"
            echo "Updated tracking issue #$number"
          else
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file "$REPORT"
          fi

      - name: Close the tracking issue when everything is current
        if: steps.scan.outputs.outdated == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh issue list --label "$ISSUE_LABEL" --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [[ -n $number ]]; then
            gh issue close "$number" --comment 'Every pinned guest provider now matches npm.'
          fi

      # Optional: an unset DINGTALK_TARGETS_JSON is a skip, not a failure, so a
      # repository that tracks this through the issue alone still gets a green run.
      - name: Push the DingTalk notification
        if: steps.scan.outputs.outdated == 'true'
        env:
          DINGTALK_TARGETS_JSON: ${{ secrets.DINGTALK_TARGETS_JSON }}
        run: |
          set -euo pipefail
          ./scripts/notify-dingtalk.sh 'agent-compose：上游 provider 有新版本' \
            <"${{ runner.temp }}/provider-upstream-report.md"

      - name: Open a draft bump pull request
        if: steps.scan.outputs.outdated == 'true' && inputs.bump
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/provider-upstream-report.md
          BUMP_FILE: ${{ runner.temp }}/provider-upstream-bump.txt
        run: |
          set -euo pipefail
          bump_args=$(cat "$BUMP_FILE")
          if [[ -z $bump_args ]]; then
            echo '::error::the scan reported outdated pins but produced no bump arguments'
            exit 1
          fi
          ./scripts/provider-lock.sh bump $bump_args
          ./scripts/provider-lock.sh check

          branch="chore/provider-bump-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add guest-images/providers.lock.json \
            guest-images/guest-abi.json \
            guest-images/Dockerfile.agent-compose-guest \
            guest-images/Dockerfile.agent-compose-guest-archlinux
          git commit -m 'chore(deps): bump guest provider pins'
          git push origin "$branch"
          # Draft on purpose: the bump is mechanical, the validation is not. The
          # pull request only becomes CI-eligible once someone marks it ready.
          gh pr create --draft \
            --title 'chore(deps): bump guest provider pins' \
            --body-file "$REPORT"
