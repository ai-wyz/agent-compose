name: Proto tag

# Publishes the proto module. A proto change merges together with its
# implementation - go.mod replaces the module with ./proto - so the contract
# reaches main before any version of it exists. Once CI passes on such a main
# commit, this workflow tags it with the next proto/vX.Y.Z and opens the pull
# request that moves the root go.mod requirement to it.
#
# The tags are made here rather than by hand so they are only ever cut from
# main and only ever move forward: a hand-made tag on a feature branch once
# published a version that lacked RPCs an earlier version had.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One tagger at a time, so two commits never claim the same next version.
concurrency:
  group: proto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag proto module
    # The branch filter also matches a pull request whose head branch is named
    # main, so require the push run that tested main itself.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      published: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - name: Decide the next proto version
        id: next
        run: |
          tag=$(./scripts/proto-next-tag.sh "$COMMIT")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push the tag
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
          echo "Tagged \`$TAG\` on \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
      # Verify whichever proto tag this commit carries, not only one this run
      # pushed: a re-run after a failed resolution finds the tag already
      # published, decides there is nothing to tag, and must still check it.
      # Deleting the tag on failure instead is not safe - the proxy may have
      # recorded the version already, and re-cutting it would give one version
      # two contents.
      - name: Find the proto tag on this commit
        id: published
        run: |
          tag=$(git tag --points-at "$COMMIT" --list 'proto/v*' |
            grep -E '^proto/v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.published.outputs.tag != ''
        with:
          go-version-file: proto/go.mod
          cache: false
      # Ask the public proxy for the version now: it is recorded in the
      # checksum database before the first client asks, and a tag that cannot
      # resolve fails here instead of in someone's go get.
      - name: Resolve the tag through the module proxy
        if: steps.published.outputs.tag != ''
        working-directory: ${{ runner.temp }}
        env:
          TAG: ${{ steps.published.outputs.tag }}
          GOPROXY: https://proxy.golang.org
        run: |
          version=${TAG#proto/}
          for attempt in 1 2 3; do
            if go list -m -json "github.com/chaitin/agent-compose/proto@$version"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::proxy.golang.org could not resolve $TAG"
          exit 1

  bump:
    name: Open the proto requirement bump
    # The root go.mod replaces the proto module, so nothing on main notices a
    # requirement that trails the published tag: the Published proto version
    # job fails on it only once a release tag is pushed. Open the bump as soon
    # as the version it names exists and resolves, which is what the tag job
    # succeeding with a tag on the commit means.
    needs: tag
    if: needs.tag.outputs.published != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ needs.tag.outputs.published }}
      BRANCH: chore/bump-proto-require
      GH_TOKEN: ${{ github.token }}
    steps:
      # The bump is a change to main as it is now, not to the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decide whether go.mod trails the tag
        id: require
        run: |
          version=$(./scripts/proto-require-bump.sh "$TAG" go.mod)
          # A bump still waiting for review may already name this version or
          # a newer one, and is refreshed only when it trails the tag too.
          pending=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [[ -n $version && -n $pending ]]; then
            git fetch --quiet origin "refs/heads/$BRANCH"
            git show FETCH_HEAD:go.mod >"$RUNNER_TEMP/pending.go.mod"
            version=$(./scripts/proto-require-bump.sh "$TAG" "$RUNNER_TEMP/pending.go.mod")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - name: Push the bump
        if: steps.require.outputs.version != ''
        env:
          VERSION: ${{ steps.require.outputs.version }}
        run: |
          sed -i -E 's|^([[:space:]]*github\.com/chaitin/agent-compose/proto) v[0-9]+\.[0-9]+\.[0-9]+$|\1 '"$VERSION"'|' go.mod
          # Assigned first so that a go.mod the edit broke stops the step.
          trailing=$(./scripts/proto-require-bump.sh "$TAG" go.mod)
          if [[ -n $trailing ]]; then
            echo "::error::go.mod still trails $TAG after the edit"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B "$BRANCH"
          git commit -q -am "chore(deps): bump proto module to $VERSION"
          git push --force origin "HEAD:refs/heads/$BRANCH"
      # A draft, like every other pull request here. That is also what gets it
      # tested: a pull request opened with the workflow token starts no
      # workflows, and marking it ready for review is a person's event that
      # does.
      - name: Open or refresh the pull request
        if: steps.require.outputs.version != ''
        env:
          VERSION: ${{ steps.require.outputs.version }}
          PENDING: ${{ steps.require.outputs.pending }}
        run: |
          title="chore(deps): bump proto module to $VERSION"
          body=$(cat <<EOF
          ## Summary

          Move the root \`go.mod\` requirement to \`$TAG\`, which the Proto tag workflow just published. The root module builds against \`./proto\` through its replace, so only the Published proto version job on a release tag notices a requirement that trails; merge this before the next release tag.

          This pull request was opened by a workflow, so its checks start only when someone marks it ready for review. If the workflow pushes a newer version here afterwards, convert it to a draft and mark it ready again.

          ## Testing

          Not run: the change is one requirement line, and the checks run once the pull request is marked ready.

          ## Checklist

          - [ ] Documentation updated when behavior or configuration changed.
          - [ ] Tests added or updated for user-visible behavior.
          - [ ] No secrets, private endpoints, internal certificates, or local runtime state included.
          EOF
          )
          if [[ -n $PENDING ]]; then
            gh pr edit "$PENDING" --title "$title" --body "$body"
            echo "Refreshed #$PENDING for \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --draft --base main --head "$BRANCH" --title "$title" --body "$body" >> "$GITHUB_STEP_SUMMARY"
          fi
